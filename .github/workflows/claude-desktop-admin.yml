# CI für das MCP-Bundle „JanuaPort Admin" (claude-desktop-admin/,
# JanuaPort/januaport#888): Abhängigkeiten aus dem Lockfile, Audit der
# Laufzeit-Abhängigkeiten als roter Schritt, Tests, und ein Probe-Pack.
name: claude-desktop-admin

on:
  push:
    paths:
      - 'claude-desktop-admin/**'
      - '.github/workflows/claude-desktop-admin.yml'
  pull_request:
    paths:
      - 'claude-desktop-admin/**'
      - '.github/workflows/claude-desktop-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-desktop-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Abhängigkeiten aus dem Lockfile
        run: npm ci --ignore-scripts

      - name: Audit der Laufzeit-Abhängigkeiten
        run: npm audit --omit=dev --audit-level=moderate

      - name: Tests
        run: npm test

      - name: Manifest prüfen und Probe-Pack
        run: |
          staging="$RUNNER_TEMP/januaport-admin-bundle"
          mkdir -p "$staging"
          cp manifest.json package.json package-lock.json .mcpbignore "$staging/"
          cp -R server "$staging/server"
          npm ci --prefix "$staging" --omit=dev --ignore-scripts
          node_modules/.bin/mcpb validate "$staging/manifest.json"
          node_modules/.bin/mcpb pack "$staging" probe.mcpb
          sha256sum probe.mcpb
